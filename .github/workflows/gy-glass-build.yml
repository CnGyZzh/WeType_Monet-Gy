name: GyGlass Independent Hook Test Build
on:
  push:
    branches: [gy-glass-v29-test]
    paths:
      - 'GyGlass_Standalone/app/**'
      - 'GyGlass_Standalone/ksu/**'
      - 'GyGlass_Standalone/*.gradle'
      - 'GyGlass_Standalone/gradle.properties'
      - 'GyGlass_Standalone/package.py'
      - '.github/workflows/gy-glass-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gy-glass-v29-test
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        id: android
      - name: Install Android SDK 35
        id: sdk35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        id: setupgradle
        with:
          gradle-version: '8.7'
      - name: Compile independent Gy Hook
        id: compile
        working-directory: GyGlass_Standalone
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gyglass-gradle.log
      - name: Package KernelSU ZIP
        working-directory: GyGlass_Standalone
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ksu/gyhook.apk
          python3 package.py
          unzip -t out/GyGlass_Standalone_v29.zip
          sha256sum out/GyGlass_Standalone_v29.zip | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GyGlass-v29-test-KSU
          path: |
            GyGlass_Standalone/out/GyGlass_Standalone_v29.zip
            GyGlass_Standalone/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish CI report to isolated test branch
        if: always()
        shell: bash
        run: |
          mkdir -p GyGlass_Standalone/out
          {
            echo 'GyGlass v29 CI report'
            echo "run_id=$GITHUB_RUN_ID"
            echo "setup_java=${{ steps.java.outcome }}"
            echo "setup_android=${{ steps.android.outcome }}"
            echo "setup_sdk35=${{ steps.sdk35.outcome }}"
            echo "setup_gradle=${{ steps.setupgradle.outcome }}"
            echo "compile_outcome=${{ steps.compile.outcome }}"
            echo "runner_job_status=${{ job.status }}"
            echo "utc_date=$(date -u +%FT%TZ)"
            echo '--- Gradle log (last 120 lines) ---'
            if test -f /tmp/gyglass-gradle.log; then tail -n 120 /tmp/gyglass-gradle.log; else echo 'Gradle task not started'; fi
          } > GyGlass_Standalone/out/build-report.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f GyGlass_Standalone/out/build-report.txt
          if test -f GyGlass_Standalone/out/GyGlass_Standalone_v29.zip; then
            git add -f GyGlass_Standalone/out/GyGlass_Standalone_v29.zip GyGlass_Standalone/out/SHA256SUMS.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish GyGlass build report and test ZIP [skip ci]'
            git push origin HEAD:gy-glass-v29-test
          fi
