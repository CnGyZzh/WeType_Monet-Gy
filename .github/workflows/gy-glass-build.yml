name: GyGlass LSPosed v35 Build
on:
  push:
    branches: [gyglass-lsp-v35-fix]
    paths: ['GyGlass_Standalone/app/**', '.github/workflows/gy-glass-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gyglass-lsp-v35-fix
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure SDK 35
        run: |
          if test ! -f "$ANDROID_HOME/platforms/android-35/android.jar"; then
            yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable APK
        working-directory: GyGlass_Standalone
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gyglass-build.log
      - name: Verify launcher and Hook assets
        working-directory: GyGlass_Standalone
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/xposed_init | grep -q '^com.gy.wetype.hook.MainHook'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -q 'launchable-activity:' /tmp/badging.txt
          grep -q "package: name='com.gy.gyglass.lsp'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: GyGlass-LSPosed-v35-Beta-APK
          path: GyGlass_Standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK and report on test branch
        if: always()
        shell: bash
        run: |
          mkdir -p GyGlass_Standalone/out
          {
            echo 'GyGlass LSPosed v35 build'
            echo "run_id=$GITHUB_RUN_ID"
            echo "status=${{ job.status }}"
            echo '--- Last build lines ---'
            tail -n 100 /tmp/gyglass-build.log 2>/dev/null || true
            echo '--- APK manifest diagnostics ---'
            cat /tmp/badging.txt 2>/dev/null || true
          } > GyGlass_Standalone/out/v35-build-report.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f GyGlass_Standalone/out/v35-build-report.txt
          if test -f GyGlass_Standalone/app/build/outputs/apk/debug/app-debug.apk; then
            cp GyGlass_Standalone/app/build/outputs/apk/debug/app-debug.apk GyGlass_Standalone/out/GyGlass-LSPosed-v35-Beta.apk
            git add -f GyGlass_Standalone/out/GyGlass-LSPosed-v35-Beta.apk
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish GyGlass v35 APK and checks [skip ci]'
            git fetch origin gyglass-lsp-v35-fix
            git rebase origin/gyglass-lsp-v35-fix
            git push origin HEAD:gyglass-lsp-v35-fix
          fi