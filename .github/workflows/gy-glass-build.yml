name: GyGlass Independent Hook Test Build
on:
  push:
    branches: [gy-glass-v29-test]
    paths:
      - 'GyGlass_Standalone/**'
      - '.github/workflows/gy-glass-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Gy independent Hook
        working-directory: GyGlass_Standalone
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Package KernelSU module
        working-directory: GyGlass_Standalone
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ksu/gyhook.apk
          python3 package.py
          unzip -t out/GyGlass_Standalone_v29.zip
          sha256sum out/GyGlass_Standalone_v29.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GyGlass-v29-test-KSU
          path: |
            GyGlass_Standalone/out/GyGlass_Standalone_v29.zip
            GyGlass_Standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
