name: Manual force update

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm that a new module version should be generated"
        required: true
        type: boolean
        default: true
      apk_url:
        description: "可选：微信输入法测试版 APK 的下载直链。默认使用 R2 中的 4.0.0.58107(57201)。"
        required: false
        type: string
        default: "https://pub-67e8fb74197c41078423c161be45017f.r2.dev/wxkb_1366.apk.1"

permissions:
  contents: write

jobs:
  release:
    if: inputs.confirm == true
    uses: ./.github/workflows/auto-update.yml
    with:
      force_build: true
      apk_url: ${{ inputs.apk_url }}
    secrets: inherit
