name: GyGlass v31 ARM64 Native Compile Test
on:
  push:
    branches:
      - gy-glass-v31-native-test
    paths:
      - 'GyGlassNative/**'
      - '.github/workflows/gyglass-native-v31.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream Zygisk header (0BSD)
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/zygisk-module-sample
          ref: master
          path: .upstream/zygisk-module-sample
          sparse-checkout: |
            module/jni/zygisk.hpp
      - name: Verify native-only source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find GyGlassNative -iname '*.apk' | wc -l)" -eq 0
          mkdir -p GyGlassNative/native/include
          cp .upstream/zygisk-module-sample/module/jni/zygisk.hpp GyGlassNative/native/include/zygisk.hpp
          g++ -std=c++17 -Wall -Wextra -Werror GyGlassNative/tests/palette_test.cpp -o /tmp/gyglass_palette_test
          /tmp/gyglass_palette_test
          bash -n GyGlassNative/module/preset.sh
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile ARM64 Zygisk component (not yet a renderer)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S GyGlassNative/native -B /tmp/gyglass-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/gyglass-build --parallel 2
          test -s /tmp/gyglass-build/libgyglass.so
          file /tmp/gyglass-build/libgyglass.so
          mkdir -p GyGlassNative/out
          cp /tmp/gyglass-build/libgyglass.so GyGlassNative/out/arm64-v8a.so
          sha256sum GyGlassNative/out/arm64-v8a.so > GyGlassNative/out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GyGlass-v31-native-compile-only
          path: |
            GyGlassNative/out/arm64-v8a.so
            GyGlassNative/out/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
