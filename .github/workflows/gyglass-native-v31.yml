name: GyGlass v31 ARM64 Native Compile Test
on:
  push:
    branches: [gy-glass-v31-native-test]
    paths:
      - 'GyGlassNative/native/**'
      - 'GyGlassNative/tests/**'
      - 'GyGlassNative/module/**'
      - '.github/workflows/gyglass-native-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream Zygisk header
        uses: actions/checkout@v4
        with:
          repository: topjohnwu/zygisk-module-sample
          ref: master
          path: .upstream/zygisk-module-sample
          sparse-checkout: |
            module/jni/zygisk.hpp
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify source and copy Zygisk SDK header
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find GyGlassNative -iname '*.apk' -print -quit)"
          src=.upstream/zygisk-module-sample/module/jni/zygisk.hpp
          test -s "$src" || { echo "Missing Zygisk header: $src"; find .upstream/zygisk-module-sample -maxdepth 5 -type f | head -40; exit 11; }
          mkdir -p GyGlassNative/native/include
          cp "$src" GyGlassNative/native/include/zygisk.hpp
          g++ -std=c++17 -Wall -Wextra -Werror GyGlassNative/tests/palette_test.cpp -o /tmp/gyglass_palette_test
          /tmp/gyglass_palette_test
          bash -n GyGlassNative/module/preset.sh
      - name: Install Android NDK and CMake
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          # Use the preinstalled sdkmanager; avoid legacy "tools" package.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /tmp/gyglass-sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1"
          test -s "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
      - name: Compile ARM64 component (renderer not yet implemented)
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          cmake -S GyGlassNative/native -B /tmp/gyglass-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/gyglass_native_build.log
          cmake --build /tmp/gyglass-build --parallel 2 2>&1 | tee -a /tmp/gyglass_native_build.log
          test -s /tmp/gyglass-build/libgyglass.so
          mkdir -p GyGlassNative/out
          cp /tmp/gyglass-build/libgyglass.so GyGlassNative/out/arm64-v8a.so
          sha256sum GyGlassNative/out/arm64-v8a.so > GyGlassNative/out/SHA256SUMS.txt
          file GyGlassNative/out/arm64-v8a.so
      - name: Write diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p GyGlassNative/ci
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "source_verify=${{ steps.verify.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "native_compile=${{ steps.compile.outcome }}"
            echo "job_status=${{ job.status }}"
            echo "--- build log ---"
            if [ -f /tmp/gyglass_native_build.log ]; then tail -n 140 /tmp/gyglass_native_build.log; else echo "Build not started; inspect source checkout and SDK steps"; fi
          } > GyGlassNative/ci/latest-report.txt
      - name: Upload diagnostics and native library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GyGlass-v31-native-diagnostics
          path: |
            GyGlassNative/out/arm64-v8a.so
            GyGlassNative/out/SHA256SUMS.txt
            GyGlassNative/ci/latest-report.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Publish lightweight status to test branch
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f GyGlassNative/ci/latest-report.txt
          git commit -m 'ci: GyGlass native build diagnostics [skip ci]' || exit 0
          git pull --rebase origin gy-glass-v31-native-test
          git push origin HEAD:gy-glass-v31-native-test
